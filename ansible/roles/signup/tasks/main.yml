---
- name: Require a rotated signup Slack webhook
  ansible.builtin.assert:
    that:
      - vault.signup.slack_webhook is defined
      - vault.signup.slack_webhook | length > 0
    fail_msg: >-
      Set vault.signup.slack_webhook in the encrypted drillpress host vault.
      Do not reuse the webhook exposed in chat; rotate it first.

- name: Signup service
  community.general.docker_container:
    name: signup
    image: ghcr.io/hal9k-dk/signup:latest
    pull: true
    networks:
      - name: nginx_net
    restart_policy: unless-stopped
    expose:
      - '8080'
    env:
      ADDR: ':8080'
      SLACK_WEBHOOK_URL: "{{ signup.slack_webhook }}"
      VIRTUAL_HOST: "{{ signup.hostname }}"
      VIRTUAL_PORT: '8080'
      LETSENCRYPT_HOST: "{{ signup.hostname }}"
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: '3'
