---

- name: Copy nginx per-host config
  ansible.builtin.copy:
    src: dokuwiki
    dest: /srv/nginx-proxy/vhost.d/wiki.hal9k.dk

- name: Copy custom logrotate config for nginx
  ansible.builtin.copy:
    src: logrotate-nginx
    dest: /srv/dokuwiki/logrotate-nginx

- name: Copy custom logrotate config for php-fpm
  ansible.builtin.copy:
    src: logrotate-phpfpm
    dest: /srv/dokuwiki/logrotate-phpfpm

- name: Copy logrotate runner script for 15min cron slot
  ansible.builtin.copy:
    src: logrotate-runner
    dest: /srv/dokuwiki/logrotate-runner
    mode: '0755'

- name: Copy PHP session GC config
  ansible.builtin.copy:
    src: php-local.ini
    dest: /srv/dokuwiki/config/php/php-local.ini

- name: Copy PHP-FPM pool config (increased max_children for bot traffic)
  ansible.builtin.copy:
    src: www2.conf
    dest: /srv/dokuwiki/config/php/www2.conf

- name: Configure DokuWiki HTTPS detection and OAuth/Slack redirect URI
  ansible.builtin.template:
    src: local.protected.php.j2
    dest: /srv/dokuwiki/config/dokuwiki/conf/local.protected.php
    mode: '0644'

- name: Dokuwiki
  community.general.docker_container:
    name: dokuwiki
    image: dokuwiki/dokuwiki:stable
    volumes:
      - "/srv/dokuwiki/config/dokuwiki:/storage"
    restart_policy: always
    expose: 8080
    user: "1000:1000"
    networks:
      - name: nginx_net
    env:
      VIRTUAL_HOST: "{{ dokuwiki.hostname }}"
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: "{{ dokuwiki.hostname }}"
      PHP_TIMEZONE: Europe/Copenhagen
      PHP_UPLOADLIMIT: 100M
      PHP_MEMORYLIMIT: 256M

- name: QR Redirect
  community.general.docker_container:
    name: qr-redirect
    image: hal9kdk/qr-redirect:latest
    volumes:
      - "/srv/dokuwiki/config/dokuwiki/data/pages:/config/dokuwiki/data/pages:rw"
    restart_policy: always
    expose: 80
    networks:
      - name: nginx_net
    env:
      VIRTUAL_HOST: "{{ qrredirect.hostname }}"
      LETSENCRYPT_HOST: "{{ qrredirect.hostname }}"
      NGINX_HOST: "{{ qrredirect.hostname }}"
      QRR_WATCH_FOLDER: /config/dokuwiki/data/pages
      QRR_PREFIX: "https://{{ dokuwiki.hostname }}"
      QRR_NOT_FOUND: /infrastruktur/it-services/qr/qr-kode_infoside
      QRR_REBUILD_RATE_LIMIT: "10"
      QRR_REBUILD_FREQ: "600"
      QRR_LINK_MAP: qr.txt

- name: Upload prune cam archive script to /usr/local/lib
  ansible.builtin.copy:
    src: dokuwiki_prune_logs.sh
    dest: /usr/local/lib/dokuwiki_prune_logs.sh
    mode: '0700'

- name: Install prune cam archive service
  ansible.builtin.copy:
    src: dokuwiki_prune_logs.service
    dest: /etc/systemd/system/

- name: Install prune cam archive timer
  ansible.builtin.copy:
    src: dokuwiki_prune_logs.timer
    dest: /etc/systemd/system/

- name: Enable prune cam archive schedule
  ansible.builtin.systemd:
    daemon_reload: yes
    name: dokuwiki_prune_logs.timer
    enabled: "yes"
    state: started
